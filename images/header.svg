<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @keyframes waveMove {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(-25px); }
      100% { transform: translateX(0); }
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes handWave {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(18deg); }
      40%      { transform: rotate(-10deg); }
      60%      { transform: rotate(14deg); }
      80%      { transform: rotate(-6deg); }
    }
    .wave-bg   { animation: waveMove 6s ease-in-out infinite; }
    .circle-a  { animation: floatUp 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .circle-b  { animation: floatUp 4s ease-in-out infinite .4s; transform-box: fill-box; transform-origin: center; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <path class="wave-bg" d="M-50,140 C100,180 250,110 400,140 C550,170 700,120 850,150 C900,158 940,160 950,155 L950,220 L-50,220 Z" fill="url(#wave)"/>

  <circle class="circle-a" cx="800" cy="70" r="10" fill="#818cf8" opacity="0.7"/>
  <circle class="circle-b" cx="825" cy="90" r="16" fill="#818cf8" opacity="0.5"/>

  <rect x="150" y="45" width="600" height="70" rx="8" fill="#4338ca" opacity="0.55"/>

  <text x="450" y="78" font-family="Courier New, monospace" font-size="30" font-weight="bold"
        letter-spacing="10" fill="#ffffff" text-anchor="middle">DANIEL ANDRADE</text>

  <text x="450" y="102" font-family="Verdana, sans-serif" font-size="14" font-style="italic"
        fill="#e0e7ff" text-anchor="middle">Desenvolvimento Full Stack, do front ao back.</text>
</svg>
